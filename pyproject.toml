[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dealroom"
version = "0.1.0"
description = "A synthetic transaction environment for evaluating tool-using agents"
requires-python = ">=3.12,<3.14"
dependencies = ["inspect-ai==0.3.271", "pydantic>=2.12,<3"]

[project.optional-dependencies]
openai = ["openai>=3.1,<4"]
anthropic = ["anthropic>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
dealroom = "dealroom.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["dealroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
